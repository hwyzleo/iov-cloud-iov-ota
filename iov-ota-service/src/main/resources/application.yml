server:
  port: 10403

mybatis-plus:
  type-aliases-package: net.hwyz.iov.cloud.iov.ota.service.infrastructure.persistence.po

# ============================================================
# CR-021: 组织自有 JSON java.time 时间契约治理（§4.25.2/4.25.3）
# - date-format: 兼容阶段显式固定 epoch-millis（保持旧毫秒输出）；ISO 切换属后续灰度阶段，
#   仅允许 epoch-millis | iso，未知值启动失败（框架探针校验）。
# - zone-id: 显式业务墙上时区（依据业务确认，不用 systemDefault 猜测）。
# - 读能力（ISO/旧整数双读）由框架 IovJavaTimeReadModule 始终注册，与写模式解耦。
# ============================================================
# FW-KAFKA Topic Provisioning 框架级开关（对齐 MDM-DSN-CR-034 模式）
# 激活 KafkaTopicProvisioningAutoConfiguration：存在性检查 + 幂等创建 OTA 发送 Topic
# （生产 Topic 由 OtaProducerTopicInitializer 以显式 allowlist 声明，见下方 ota.kafka.startup）
iov:
  web:
    jackson:
      date-format: ${IOV_WEB_JACKSON_DATE_FORMAT:epoch-millis}
      zone-id: ${IOV_WEB_JACKSON_ZONE_ID:Asia/Shanghai}
  kafka:
    topic-provisioning:
      enabled: ${IOV_KAFKA_TOPIC_PROVISIONING_ENABLED:true}

# ============================================================
# CR-013/CR-020: OTA Kafka 消息化（车外 MQTT、云内 Kafka）
# Topic 名称以 Kafka Topic 目录为基线，统一由 ota.kafka.topics.* 管理；
# 上行 vagw.fota（消费）/ 下行 ota.fota（生产）/ 上行 DLQ ota.fota.dlq.up（生产）
# / VAGW 上行错误流 vagw.fota.dlq.up（消费）/ 车辆清单观测（生产）。
# IOV-OTA 仅幂等初始化自己生产的三个 Topic，消费 Topic 缺失时启动期 fail-fast。
# ============================================================
ota:
  # OTA 业务墙上时区（CR-021 §4.25.3：无时区墙上时间串的显式解释时区）
  time:
    business-zone-id: ${OTA_TIME_BUSINESS_ZONE_ID:Asia/Shanghai}
  kafka:
    startup:
      # 是否由 OtaProducerTopicInitializer 幂等初始化三个生产 Topic（本地开发可关闭）
      initialize-producer-topics: ${OTA_KAFKA_INITIALIZE_PRODUCER_TOPICS:true}
      # 启动校验失败处理策略：fail-fast（默认）| warn
      validation-mode: ${OTA_KAFKA_STARTUP_VALIDATION_MODE:fail-fast}
    topics:
      fota-up: ${OTA_KAFKA_TOPICS_FOTA_UP:vagw.fota}
      vagw-up-dlq: ${OTA_KAFKA_TOPICS_VAGW_UP_DLQ:vagw.fota.dlq.up}
      fota-down: ${OTA_KAFKA_TOPICS_FOTA_DOWN:ota.fota}
      fota-up-dlq: ${OTA_KAFKA_TOPICS_FOTA_UP_DLQ:ota.fota.dlq.up}
      inventory-observed: ${OTA_KAFKA_TOPICS_INVENTORY_OBSERVED:ota.vehicle-software-inventory.observed}
      vmd-vehicle-produce: ${OTA_KAFKA_TOPICS_VMD_VEHICLE_PRODUCE:vmd.vehicle-produce}
      vmd-part-binding-changed: ${OTA_KAFKA_TOPICS_VMD_PART_BINDING_CHANGED:vmd.vehcile-part-binding.changed}
    topic-definitions:
      default-partitions: ${OTA_KAFKA_TOPIC_DEFAULT_PARTITIONS:3}
      default-replication-factor: ${OTA_KAFKA_TOPIC_DEFAULT_REPLICATION_FACTOR:1}
      topics:
        ota.fota:
          partitions: ${OTA_FOTA_PARTITIONS:3}
          replication-factor: ${OTA_FOTA_REPLICAS:1}
        ota.fota.dlq.up:
          partitions: ${OTA_FOTA_DLQ_PARTITIONS:3}
          replication-factor: ${OTA_FOTA_REPLICAS:1}
        ota.vehicle-software-inventory.observed:
          partitions: ${OTA_INVENTORY_PARTITIONS:3}
          replication-factor: ${OTA_INVENTORY_REPLICAS:1}
    inbound:
      enabled: true
      group-id: ${OTA_KAFKA_GROUP_ID:iov-cloud-iov-ota}
      concurrency: ${OTA_KAFKA_INBOUND_CONCURRENCY:3}
    outbound:
      enabled: true
      max-retry: ${OTA_KAFKA_OUTBOUND_MAX_RETRY:5}
      backoff-base-seconds: ${OTA_KAFKA_OUTBOUND_BACKOFF_BASE:1}
      batch-size: ${OTA_KAFKA_OUTBOUND_BATCH_SIZE:100}
      poll-interval-ms: ${OTA_KAFKA_OUTBOUND_POLL_INTERVAL:2000}
    cloud-events:
      enabled: ${OTA_CLOUD_EVENTS_ENABLED:true}
      max-retry: ${OTA_CLOUD_EVENTS_MAX_RETRY:5}
      backoff-base-seconds: ${OTA_CLOUD_EVENTS_BACKOFF_BASE:1}
      batch-size: ${OTA_CLOUD_EVENTS_BATCH_SIZE:100}
      poll-interval-ms: ${OTA_CLOUD_EVENTS_POLL_INTERVAL:2000}